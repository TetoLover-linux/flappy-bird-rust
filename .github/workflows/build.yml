name: Build Cross-Platform

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NDK fijado para builds reproducibles (r25b, recomendado por macroquad)
  ANDROID_NDK_VERSION: "25.2.9519653"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Escritorio: Linux / macOS / Windows
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: flappy_bird-linux
            binary_path: target/release/flappy_bird
          - os: macos-latest
            artifact_name: flappy_bird-macos
            binary_path: target/release/flappy_bird
          - os: windows-latest
            artifact_name: flappy_bird-windows.exe
            binary_path: target/release/flappy_bird.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build project
        run: cargo build --release --verbose

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════════════════════
  # Android: se usa Rust 1.82.0 para garantizar que Cargo genere y entienda
  # lockfiles v3, que es lo único que soporta cargo-quad-apk 0.1.4.
  # ════════════════════════════════════════════════════════════════════════════
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Toolchain 1.82.0 (lockfile v3 por defecto) + targets Android ──────
      - name: Install Rust 1.82.0 (Android targets)
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-rust182

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner ubuntu-latest ya trae ANDROID_HOME y sdkmanager preinstalados.
      - name: Verify Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version

      # ── NDK, plataformas y build-tools ────────────────────────────────────
      - name: Install NDK, platforms and build-tools
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-34" \
            "platforms;android-29" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "build-tools;29.0.0"

      - name: Configure Android environment
        run: |
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"

      # ── Regenerar el lockfile con Cargo 1.82.0 (formato v3) ───────────────
      # Se elimina el lockfile v4 existente y se crea uno nuevo compatible
      # con la librería cargo que usa cargo-quad-apk 0.1.4.
      - name: Regenerate Cargo.lock as v3 (Rust 1.82)
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo generate-lockfile
          echo "── Versión del lockfile generado:"
          head -n 1 Cargo.lock

      # ── Instalar cargo-quad-apk usando la toolchain 1.82.0 ────────────────
      - name: Install cargo-quad-apk (with Rust 1.82.0)
        run: cargo install cargo-quad-apk --locked

      # ── Compilar las 3 ABIs y empaquetar el APK universal ─────────────────
      - name: Build APK (release, universal)
        run: cargo quad-apk build --release

      # ── Firmar el APK (debug key generada en el runner) para sideload ─────
      - name: Sign APK
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          APK_DIR="target/android-artifacts/release/apk"
          echo "── Artefactos generados:"
          ls -la "${APK_DIR}"
          RAW_APK="${APK_DIR}/unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK="$(ls "${APK_DIR}"/*.apk | head -n 1)"
          fi
          echo "── Firmando: ${RAW_APK}"
          KEYSTORE="${RUNNER_TEMP}/flappy-debug.keystore"
          keytool -genkeypair -v \
            -keystore "${KEYSTORE}" \
            -storepass android -alias flappybird -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Flappy Bird Debug, OU=CI, O=TetoLover-linux, C=AR"
          "${BT}/zipalign" -f 4 "${RAW_APK}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" sign \
            --ks "${KEYSTORE}" --ks-pass pass:android --key-pass pass:android \
            --out "flappy_bird-android.apk" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" verify --print-certs "flappy_bird-android.apk"
          echo "── APK final:"
          ls -la flappy_bird-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flappy_bird-android-apk
          path: flappy_bird-android.apk
          if-no-files-found: error

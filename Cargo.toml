[package]
name = "flappy_bird"
version = "0.1.0"
edition = "2021"

[dependencies]
# sola-raylib 6.x es el fork mantenido de raylib-rs que enlaza contra raylib 6.0.
# Se eliminan las features específicas de X11 (GLFW_BUILD_X11), ya que no aplican
# a Android. Para el backend gráfico se usa OpenGL ES 2.0, que es el recomendado
# para dispositivos móviles. En escritorio, sola-raylib seleccionará
# automáticamente el backend adecuado si no se fuerza ninguno, pero al incluir
# "opengl_es_20" se prioriza la compatibilidad móvil.
sola-raylib = { 
    version = "6", 
    default-features = false, 
    features = [
        "opengl_es_20",          # Backend OpenGL ES 2.0 (móvil/Android)
        # Las siguientes features (SUPPORT_MODULE_*) no aparecen listadas en la
        # documentación de sola-raylib, pero si tu compilación falla por
        # símbolos no encontrados (p. ej. draw_rectangle, draw_text), puedes
        # intentar añadirlas. En la mayoría de los casos no son necesarias
        # porque sola-raylib habilita los módulos esenciales por defecto.
        # "SUPPORT_MODULE_RSHAPES",
        # "SUPPORT_MODULE_RTEXT",
        # "SUPPORT_MODULE_RTEXTURES",
    ] 
}

# La crate `rand` ya no es necesaria: SimpleRng en main.rs la sustituye.
# rand = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"      # Puedes cambiarlo a 3 si priorizas fluidez sobre tamaño.
overflow-checks = false
debug = false
incremental = false
rpath = false

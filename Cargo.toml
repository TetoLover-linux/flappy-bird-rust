[package]
name = "flappy_bird"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # Necesario para Android

[dependencies]
raylib = { version = "6.0", default-features = false, features = ["opengl_21"] }
rand = "0.8"

# Configuración para cargo-apk
[package.metadata.android]
package = "com.ejemplo.flappybird"
# Compilar solo para ARM (cubre >95% de dispositivos y reduce el tamaño del APK)
build_targets = [ "arm64-v8a", "armeabi-v7a" ]
# minSdkVersion bajo para cubrir la mayor cantidad de versiones (Android 5.0+)
min_sdk_version = 21
# targetSdkVersion recomendado
target_sdk_version = 34

# Perfil de release optimizado para tamaño
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"

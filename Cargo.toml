[package]
name = "flappy_bird"
version = "0.1.0"
edition = "2021"

[dependencies]
raylib = { version = "6.0", default-features = false, features = ["opengl_21"] }
rand = "0.8"

# Perfil de release optimizado para tamaño
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
